# Real WC 2026 match data from ESPN's public API, with the committed snapshot in
# backend/data/wc2026 as the permanent fallback (see api/main_hybrid.py and
# api/workers/match_producer.py). No paid API key is required. Ports bind to 127.0.0.1
# only; Redis and Weaviate run without auth and Neo4j and Grafana use dev-default
# logins. Put a reverse proxy in front before exposing anything.
#
# Optional env vars:
#   NEO4J_PASSWORD / GRAFANA_ADMIN_PASSWORD: override the dev defaults (wc2026pass / admin)
#   TRIGGER_TOKEN: shared secret for the /trigger debug endpoints. If set, also set
#   NEXT_PUBLIC_TRIGGER_TOKEN to the same value in ui/.env.local; the UI's briefing and
#   narrative trigger buttons send it as X-Trigger-Token and get a silent 401
#   otherwise. The ui/ Next.js app is not in this compose file; run it separately with
#   `npm run dev`.
#   ODDS_API_KEY: enables market odds via The Odds API (else Elo fallback)
#   ESPN_LEAGUE / ESPN_SEASON: feed competition (default fifa.world / 2026)

services:

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    container_name: wc2026-weaviate
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051" # gRPC (used by v4 Python client)
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"   # we bring our own vectors
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
      STANDALONE_MODE: "true"
    volumes:
      - ./weaviate_data:/var/lib/weaviate
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    container_name: wc2026-neo4j
    ports:
      - "127.0.0.1:7474:7474"  # browser UI
      - "127.0.0.1:7687:7687"  # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-wc2026pass}
    volumes:
      - ./neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  api:
    build:
      context: ./backend
    command: uvicorn api.main_hybrid:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-wc2026pass}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:7b-instruct-q4_K_M}
      TRIGGER_TOKEN: ${TRIGGER_TOKEN:-}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      MASTODON_ACCESS_TOKEN: ${MASTODON_ACCESS_TOKEN:-}
      BLUESKY_HANDLE: ${BLUESKY_HANDLE:-}
      BLUESKY_APP_PASSWORD: ${BLUESKY_APP_PASSWORD:-}
      CF_SIMS: ${CF_SIMS:-20000}
      ESPN_LEAGUE: ${ESPN_LEAGUE:-fifa.world}
      ESPN_SEASON: ${ESPN_SEASON:-2026}
      POLL_INTERVAL: ${POLL_INTERVAL:-30}
      FT_ACTIVE_GRACE_S: ${FT_ACTIVE_GRACE_S:-21600}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-pitchpulse}
    depends_on:
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
